# Load the bundle from local Metro in a freshly launched dev client and close the Expo dev menu, ending on the app
# (home or the first-run InitialScreen). Shared by open-app.yaml and flows that launch with other permissions.
# The app is matched by testID (Client/app/utils/testIds.ts); only the Expo dev-client UI (always English) and the iOS
# link alert use text (checked by qa/lab/tests/maestro-selectors.test.sh). env: METRO_URL (url-encoded)
# disableOnboarding=1 skips the dev-menu onboarding sheet, whose "Continue" button reads like the app's InitialScreen one
appId: com.socketNull.ExposeMe
---
- openLink: "exp+expose-me://expo-development-client/?url=${METRO_URL}&disableOnboarding=1"
- waitForAnimationToEnd:
    timeout: 5000
# iOS 26+/Xcode 27 simulators confirm custom-scheme links with a system alert
- runFlow:
    when:
      platform: iOS
      visible: "Open in Expose Me\\?|¿Abrir en Expose Me\\?"
    commands:
      - tapOn: "Open|Abrir"
# ── Bundle wait ──
# Poll until the app (by testID) or the Expo dev menu, which opens at launch over it, shows up: one selector can't OR a
# testID with text. After clearState the dev client may stay on its launcher instead of loading the bundle, sometimes
# only after a while (seen on Android): pick the local server when it shows, which restarts the wait for the download,
# up to maxServerPicks times so a launcher that keeps coming back fails the flow instead of hanging it.
# lab.sh's STUCK_ATTEMPT_S counts on this timeout (lab-play.test.sh reads its `timeout: <ms>`).
- evalScript: "${output.devClientBoot = { timeout: 120000, maxServerPicks: 2, serverPicks: 0, loaded: false }}"
- evalScript: ${output.devClientBoot.deadline = Date.now() + output.devClientBoot.timeout}
- repeat:
    while:
      true: ${!output.devClientBoot.loaded && Date.now() < output.devClientBoot.deadline}
    commands:
      - runFlow:
          when:
            visible:
              id: "join-game-button|initial-screen"
          commands:
            - evalScript: ${output.devClientBoot.loaded = true}
      - runFlow:
          when:
            true: ${!output.devClientBoot.loaded}
            visible: "Connected to:|Runtime version:.*"
          commands:
            - evalScript: ${output.devClientBoot.loaded = true}
      - runFlow:
          when:
            true: ${!output.devClientBoot.loaded && output.devClientBoot.serverPicks < output.devClientBoot.maxServerPicks}
            visible: "Development servers|DEVELOPMENT SERVERS"
          commands:
            # the server entry is discovered after the header renders (slow emulators)
            - extendedWaitUntil:
                visible: "http://.*:8081"
                timeout: 30000
            - tapOn: "http://.*:8081"
            - evalScript: ${output.devClientBoot.serverPicks += 1}
            - evalScript: ${output.devClientBoot.deadline = Date.now() + output.devClientBoot.timeout}
- assertTrue: ${output.devClientBoot.loaded}
# The dev menu opens at launch (showsAtLaunch defaults to true): close it (SDK 58 menu header shows "Runtime version")
- runFlow:
    when:
      visible: "Connected to:|Runtime version:.*"
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - pressKey: Back
      - runFlow:
          when:
            platform: iOS
          commands:
            # Drag the sheet itself (a plain DOWN swipe starts above the sheet and does nothing)
            - swipe:
                from:
                  text: "Runtime version:.*|Connected to:.*"
                direction: DOWN
- extendedWaitUntil:
    visible:
      id: "join-game-button|initial-screen"
    timeout: 60000
