# Device creates the room (bots then join with --code). Writes nothing; read the code from the screenshot/logs.
# Selectors are testIDs (Client/app/utils/testIds.ts), so the flow works in any UI language.
appId: com.socketNull.ExposeMe
---
- runFlow: open-app.yaml
# Clear a previously saved name before typing
- tapOn:
    id: "username-clear-button"
    optional: true
- tapOn:
    id: "username-input"
- inputText: ${USERNAME}
- hideKeyboard
- tapOn:
    id: "create-game-button"
- extendedWaitUntil:
    visible:
      id: "start-game-button"
    timeout: 30000
- takeScreenshot: host-lobby-${USERNAME}
