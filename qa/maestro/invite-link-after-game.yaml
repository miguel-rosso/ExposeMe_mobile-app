# EXP-206: an invite link always wins over the room left from a previous game. The device plays a short game in room A,
# taps "Play again" (back in A's lobby, socket still bound to A), then opens the invite deep link of room B: it must
# leave A and land in B's lobby (B's code, B's players), not rejoin A. Before the fix the lobby ignored the link
# while GameContext still held A's code. EXP-347 (DEC-046): B is only joined after Join in the invite dialog, which
# shows B's code and the saved name. EXP-358 (DEC-047): A is only left on that Join; Cancel first returns to A's lobby
# unchanged, and the same link then asks again.
# Room A has 2 bots and room B 3 (bot names repeat across bots.mjs processes, but each room is separate on the
# server): lobby-player-bot3 only exists in B. A's bots record the device's player-left when it switches rooms.
# Run from the repo root against the lab server (never production), one device at a time:
#   qa/lab/lab.sh play --devices <label> --bots 2 --rounds 3 --flow invite-link-after-game \
#     --bot-args "--play-again-linger 60 --play-again-linger-bot 0" \
#     --second-room "--bots 3 --host --wait-players 5 --timeout 900"
# Room A is the main play room (2 bots + the device: starts once it joins, plays 3 rounds, then every bot plays again
# at once and waits in A's lobby). Room B is the --second-room: 3 bots that only wait in the lobby (5 players never
# arrive, so it never starts); lab.sh passes its code as NEW_CODE and stops those bots when the run ends (their
# result does not count).
# env: GAME_CODE (room A), NEW_CODE (room B), USERNAME, METRO_URL (url-encoded)
# Selectors are testIDs (Client/app/utils/testIds.ts), so the flow works in any UI language.
# lab: one device (a second device joining room B would make its 5 players and start its game)
appId: com.socketNull.ExposeMe
---
- runFlow: open-app.yaml
- runFlow: join-room.yaml
- runFlow: play-rounds.yaml
- runFlow: play-again.yaml
# Back in room A's lobby: the app still remembers A
- extendedWaitUntil:
    visible:
      id: "lobby-game-code"
      text: "${GAME_CODE}"
    timeout: 20000
- assertNotVisible:
    id: "lobby-player-bot3"
- takeScreenshot: invite-old-lobby-${USERNAME}
# Asked first: B's code, the saved name filled in
- runFlow: open-invite-link.yaml
# EXP-358 (DEC-047): Cancel returns to room A's lobby unchanged (the device never left it)
- tapOn:
    id: "invite-cancel-button"
- extendedWaitUntil:
    notVisible:
      id: "invite-confirm-modal"
    timeout: 5000
- assertVisible:
    id: "lobby-game-code"
    text: "${GAME_CODE}"
- assertVisible:
    id: "lobby-player-${USERNAME}"
- assertVisible:
    id: "lobby-player-bot1"
- assertNotVisible:
    id: "lobby-player-offline-.*"
- assertNotVisible:
    id: "lobby-player-bot3"
- takeScreenshot: invite-cancelled-${USERNAME}
# The same link asks again (Cancel cleared it)
- runFlow: open-invite-link.yaml
- takeScreenshot: invite-confirm-${USERNAME}
- tapOn:
    id: "invite-join-button"
# Room B's lobby, not A's
- extendedWaitUntil:
    visible:
      id: "lobby-game-code"
      text: "${NEW_CODE}"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "lobby-player-bot3"
    timeout: 20000
- assertVisible:
    id: "lobby-player-bot1"
- assertVisible:
    id: "lobby-player-${USERNAME}"
- assertNotVisible:
    id: "lobby-player-offline-.*"
# B's host is bot1: the device is a guest here
- assertVisible:
    id: "lobby-waiting"
- assertNotVisible:
    id: "start-game-button"
- takeScreenshot: invite-new-lobby-${USERNAME}
