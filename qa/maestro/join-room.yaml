# Join room ${GAME_CODE} as ${USERNAME} and wait in the lobby.
# Selectors are testIDs (Client/app/utils/testIds.ts), so the flow works in any UI language.
appId: com.socketNull.ExposeMe
---
# Clear a previously saved name before typing
- tapOn:
    id: "username-clear-button"
    optional: true
- tapOn:
    id: "username-input"
- inputText: ${USERNAME}
# With two iOS simulators driven in parallel the typed name is sometimes lost (field still empty, so the
# join button does nothing): type it again once if the field does not hold the name
- runFlow:
    when:
      notVisible:
        id: "username-input"
        text: "${USERNAME}"
    commands:
      - tapOn:
          id: "username-input"
      - inputText: ${USERNAME}
# Submit instead of hideKeyboard: on Android hideKeyboard sends Back, which (SDK 58) also closes the app
# on the home screen; on iOS 26 hideKeyboard leaves the keyboard covering the join button.
- pressKey: Enter
- tapOn:
    id: "join-game-button"
# The field keeps the last code entered/created in this session (GameContext gameCode) and a tap puts the
# cursor mid-text, so eraseText alone leaves characters after it: double tap selects the whole code first
- runFlow:
    when:
      visible:
        id: "game-code-input"
        text: "[A-Z0-9]+"
    commands:
      - doubleTapOn:
          id: "game-code-input"
      - eraseText: 12
- tapOn:
    id: "game-code-input"
- inputText: ${GAME_CODE}
# Codes are alphanumeric (letters keyboard, typed in any case): the full keyboard can cover the search button,
# so submit to close it first (Enter blurs the field on both platforms; hideKeyboard is unsafe, see above)
- pressKey: Enter
- tapOn:
    id: "search-room-button"
# Lobby (guest or host) or already in the game
- extendedWaitUntil:
    visible:
      id: "lobby-waiting|start-game-button|game-waiting-ready|game-waiting-photo|player-option-.*"
    timeout: 30000
- takeScreenshot: lobby-${USERNAME}
