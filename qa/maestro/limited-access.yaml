# EXP-041: play without clearState or permission grants, so a limited/partial photo access set by the tester
# survives (open-app.yaml would reset it). The app must already be on the home screen.
# EXP-118: the Create/Join gate accepts limited access as long as at least one photo is selected, so the device joins
# straight into the lobby (no gallery-access-modal, never SettingsInstructionsScreen). With nothing selected it stays
# on the home screen with the gallery-access-modal ("Select photos"). Revoking access mid-game shows the blocking
# gallery-access-modal on return to the foreground, without leaving the game. iOS simulator: TCC.db kTCCServicePhotos auth_value=3 for the app +
# `xcrun simctl spawn <udid> launchctl kickstart -k user/foreground/com.apple.tccd` (the app keeps running; the
# limited selection made earlier in the system picker is kept). Android revokes kill the app, so only the join can be
# checked there.
#   qa/lab/lab.sh play --flow limited-access --bots 2 --devices ios-b
# On its turn the device must stay in the game (an allowed photo, or the in-game skip notice).
# env: GAME_CODE, USERNAME
appId: com.socketNull.ExposeMe
---
# Expo dev-menu onboarding sheet / open dev menu left over from the manual launch
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Connected to:|Runtime version:.*"
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - pressKey: Back
      - runFlow:
          when:
            platform: iOS
          commands:
            - swipe:
                from:
                  text: "Runtime version:.*|Connected to:.*"
                direction: DOWN
- extendedWaitUntil:
    visible:
      id: "join-game-button"
    timeout: 60000
- runFlow: join-room.yaml
- assertNotVisible:
    id: "gallery-access-modal"
- runFlow: play-rounds.yaml
- assertNotVisible:
    id: "initial-screen"
