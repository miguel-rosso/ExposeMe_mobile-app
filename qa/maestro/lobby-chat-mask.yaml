# EXP-424: the server masks offensive words in chat messages (Server/managers/chatFilter.ts) and the sender's own
# bubble shows the masked text from chat-message's ack, exactly what the room got: never the text as typed.
# The text is ASCII ("que", not "qué"): Maestro's inputText can't type accented characters on Android.
# The unit guarantees are in Server/tests/chatFilter*.test.ts and Client/__tests__/waitingRoomChatShare.test.tsx.
# No bots needed (the device hosts the room itself and is the sender), so run it directly against the lab server:
#   ~/.maestro/bin/maestro --device <id> test qa/maestro/lobby-chat-mask.yaml -e USERNAME=<label> -e METRO_URL=<url-encoded>
# env: USERNAME, METRO_URL (url-encoded)
# Selectors are testIDs (Client/src/utils/testIds.ts); the bubble is matched by the message text (a regex: the
# asterisks are escaped), which is the player's own text in any UI language.
appId: com.socketNull.ExposeMe
---
- runFlow: host-lobby.yaml
- tapOn:
    id: "chat-input"
- inputText: "que puta foto"
- tapOn:
    id: "chat-send-button"
# The bubble shows for about 5 s: wait for it, then check right away
- extendedWaitUntil:
    visible: "que p\\*\\*\\* foto"
    timeout: 5000
- assertNotVisible: "que puta foto"
- assertVisible:
    id: "chat-input"
- takeScreenshot: lobby-chat-mask-${USERNAME}
- tapOn:
    id: "close-button"
- extendedWaitUntil:
    visible:
      id: "create-game-button"
    timeout: 10000
