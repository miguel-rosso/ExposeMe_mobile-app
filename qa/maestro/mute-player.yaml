# EXP-422 / DEC-052 A: muting a player on this device. The device hosts (like device-host-start.yaml): it creates the
# room, the bots join its code. In the lobby it mutes bot1 from its row: the host's tap on a row asks to remove that
# player, the mute button next to it never does. bot1 stays muted into the game (its scoreboard row says "Unmute bot1"),
# and the device mutes bot2 from the first scoreboard it reads. The bots send emoji reactions during every reveal and
# scoreboard: bot3's keep showing, bot1's and bot2's never do. A muted bot's round photo is shown like anyone's
# (DEC-063, checked by Client/__tests__/gameMutePlayer.test.tsx). The flow ends there; the bots play on to game over.
# The device never answers (it scores nothing, which changes nothing here).
#   qa/lab/lab.sh play --device-host --flow mute-player --devices <label> --bots 3 --bot-args "--emoji-rate 2"
# A reaction pill lasts 2.6 s and each bot sends 2 a second, so a look that finds bot3's pill would find a muted bot's
# too if the app showed them. Their absence is read in the next screen read, which may fall after the scoreboard
# (nothing is sent while answering): a few rounds of looks make it hold.
# env: USERNAME, METRO_URL (url-encoded), CODE_SINK_URL
# Selectors are testIDs (Client/src/utils/testIds.ts), so the flow works in any UI language; a mute button's state is
# its screen reader name ("Mute bot1" / "Silenciar a bot1", "Unmute bot1" / "Quitar silencio a bot1"), read in both.
# lab: one device (the room's host)
appId: com.socketNull.ExposeMe
---
- runFlow: host-lobby.yaml
- extendedWaitUntil:
    visible:
      id: "lobby-game-code"
      text: "[A-Z0-9]{6}"
    timeout: 30000
- copyTextFrom:
    id: "lobby-game-code"
    text: "[A-Z0-9]{6}"
# Maestro's http runs on the lab machine, where lab.sh's listener waits for the code (then starts the bots)
- evalScript: "${output.codePost = http.post(CODE_SINK_URL, { body: maestro.copiedText }).status}"
- assertTrue:
    condition: ${output.codePost == 200}
    label: "lab.sh's listener took the room code (CODE_SINK_URL)"
- extendedWaitUntil:
    visible:
      id: "lobby-player-bot3"
    timeout: 60000
    label: "The bots joined the device's room"
# ── Lobby: the mute button mutes at once and never asks to remove ──
- tapOn:
    id: "lobby-mute-bot1"
- assertNotVisible:
    id: "alert-modal|remove-player-confirm"
- assertVisible:
    id: "lobby-mute-bot1"
    text: "Unmute bot1|Quitar silencio a bot1"
- assertVisible:
    id: "lobby-player-bot1"
- takeScreenshot: mute-player-lobby-${USERNAME}
- tapOn:
    id: "start-game-button"
# ── Game: bot1 is still muted; mute bot2 from a scoreboard ──
# The first scoreboard: up after the game starts and round 1 (photo wait, answering, reveal)
- extendedWaitUntil:
    visible:
      id: "score-mute-bot1"
      text: "Unmute bot1|Quitar silencio a bot1"
    timeout: 240000
    label: "bot1, muted in the lobby, is still muted on the game's scoreboard"
# A scoreboard lasts 5 s: a tap that comes as it closes is tried again on the next one
- evalScript: "${output.mute = { tries: 0, done: false }}"
- repeat:
    while:
      true: ${!output.mute.done && ++output.mute.tries <= 4}
    commands:
      - extendedWaitUntil:
          visible:
            id: "score-mute-bot2"
          timeout: 120000
      - runFlow:
          when:
            visible:
              id: "score-mute-bot2"
              text: "Mute bot2|Silenciar a bot2"
          commands:
            - tapOn:
                id: "score-mute-bot2"
                retryTapIfNoChange: false
      - runFlow:
          when:
            visible:
              id: "score-mute-bot2"
              text: "Unmute bot2|Quitar silencio a bot2"
          commands:
            - evalScript: ${output.mute.done = true}
- assertTrue:
    condition: ${output.mute.done}
    label: "bot2 muted from a scoreboard row"
- takeScreenshot: mute-player-scoreboard-${USERNAME}
# ── No reaction from a muted bot, while bot3's show ──
- repeat:
    times: 5
    commands:
      - extendedWaitUntil:
          visible:
            id: "reaction-bot3"
          timeout: 60000
          label: "The bots' reactions reach the device (bot3, not muted)"
      - assertNotVisible:
          id: "reaction-bot1|reaction-bot2"
