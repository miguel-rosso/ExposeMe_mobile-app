# Cold-start the dev client pointed at local Metro and get past first-run screens.
# App screens are matched by testID (Client/app/utils/testIds.ts). Only the Expo dev-client UI
# (always English) and the first wait below, which must OR dev-menu text with app content, use text.
appId: com.socketNull.ExposeMe
---
- launchApp:
    clearState: true
    permissions:
      photos: allow
      medialibrary: allow
- openLink: "exp+expose-me://expo-development-client/?url=${METRO_URL}"
- waitForAnimationToEnd:
    timeout: 5000
# iOS 26+/Xcode 27 simulators confirm custom-scheme links with a system alert
- runFlow:
    when:
      platform: iOS
      visible: "Open in Expose Me\\?|¿Abrir en Expose Me\\?"
    commands:
      - tapOn: "Open|Abrir"
# After clearState the dev client may stay on its launcher instead of loading the bundle
- runFlow:
    when:
      visible: "Development servers"
    commands:
      # the server entry is discovered after the header renders (slow emulators)
      - extendedWaitUntil:
          visible: "http://.*:8081"
          timeout: 30000
      - tapOn: "http://.*:8081"
# The launcher can also show up only after the check above (seen on Android): wait for it too, then pick the server
- extendedWaitUntil:
    visible: "This is the developer menu.*|Join Game|Unirse a Partida|Tap to proceed after setting permissions|Pulsa para continuar tras configurar los permisos|Development servers|DEVELOPMENT SERVERS"
    timeout: 120000
- runFlow:
    when:
      visible: "Development servers|DEVELOPMENT SERVERS"
    commands:
      # the server entry is discovered after the header renders (slow emulators)
      - extendedWaitUntil:
          visible: "http://.*:8081"
          timeout: 30000
      - tapOn: "http://.*:8081"
- extendedWaitUntil:
    visible: "This is the developer menu.*|Join Game|Unirse a Partida|Tap to proceed after setting permissions|Pulsa para continuar tras configurar los permisos"
    timeout: 120000
# Expo dev-menu onboarding sheet (first launch after clearState)
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: "Continue"
# The full dev menu stays open after onboarding: close it (SDK 58 menu header shows "Runtime version")
- runFlow:
    when:
      visible: "Connected to:|Runtime version:.*"
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - pressKey: Back
      - runFlow:
          when:
            platform: iOS
          commands:
            # Drag the sheet itself (a plain DOWN swipe starts above the sheet and does nothing)
            - swipe:
                from:
                  text: "Runtime version:.*|Connected to:.*"
                direction: DOWN
- extendedWaitUntil:
    visible:
      id: "join-game-button|initial-screen"
    timeout: 60000
# App first-run permissions explainer (InitialScreen)
- runFlow:
    when:
      visible:
        id: "initial-screen"
    commands:
      # The dev client's floating Tools button is hidden by the app on launch (EXP-200), so the toggle is tappable
      # EXP-122: the onboarding offers the language toggle. Tap it twice (net no change, so later
      # flows keep the device language) and check the warning header switches language each time.
      - runFlow:
          when:
            visible:
              id: "initial-warning"
              text: ".*Warning.*"
          commands:
            - tapOn:
                id: "language-toggle"
            - extendedWaitUntil:
                visible:
                  id: "initial-warning"
                  text: ".*Aviso.*"
                timeout: 5000
            - tapOn:
                id: "language-toggle"
            - extendedWaitUntil:
                visible:
                  id: "initial-warning"
                  text: ".*Warning.*"
                timeout: 5000
      - runFlow:
          when:
            visible:
              id: "initial-warning"
              text: ".*Aviso.*"
          commands:
            - tapOn:
                id: "language-toggle"
            - extendedWaitUntil:
                visible:
                  id: "initial-warning"
                  text: ".*Warning.*"
                timeout: 5000
            - tapOn:
                id: "language-toggle"
            - extendedWaitUntil:
                visible:
                  id: "initial-warning"
                  text: ".*Aviso.*"
                timeout: 5000
      - scrollUntilVisible:
          element:
            id: "initial-continue-button"
      - tapOn:
          id: "initial-continue-button"
# iOS photo-library alert (shown even when simctl/launchApp pre-granted photos)
- tapOn:
    text: "Allow Full Access|Allow all|Allow|Permitir acceso total|Permitir todo|Permitir"
    optional: true
- extendedWaitUntil:
    visible:
      id: "join-game-button"
    timeout: 30000
