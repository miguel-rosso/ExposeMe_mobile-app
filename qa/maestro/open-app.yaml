# Cold-start the dev client pointed at local Metro and get past first-run screens.
# Text selectors are a stopgap until the app exposes testIDs (backlog: EXP-008).
appId: com.socketNull.ExposeMe
---
- launchApp:
    clearState: true
    permissions:
      photos: allow
      medialibrary: allow
- openLink: "exp+expose-me://expo-development-client/?url=${METRO_URL}"
- waitForAnimationToEnd:
    timeout: 5000
# After clearState the dev client may stay on its launcher instead of loading the bundle
- runFlow:
    when:
      visible: "Development servers"
    commands:
      - tapOn: "http://.*:8081"
- extendedWaitUntil:
    visible: "This is the developer menu.*|Join Game|Create Game|Tap to proceed after setting permissions"
    timeout: 120000
# Expo dev-menu onboarding sheet (first launch after clearState)
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: "Continue"
# The full dev menu stays open after onboarding: close it
- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - pressKey: Back
      - runFlow:
          when:
            platform: iOS
          commands:
            - swipe:
                direction: DOWN
- extendedWaitUntil:
    visible: "Join Game|Create Game|Tap to proceed after setting permissions"
    timeout: 60000
# App first-run permissions explainer (InitialScreen)
- runFlow:
    when:
      visible: "Tap to proceed after setting permissions"
    commands:
      - scrollUntilVisible:
          element: "Continue"
      - tapOn: "Continue"
- tapOn:
    text: "Allow Full Access|Allow all|Allow"
    optional: true
- extendedWaitUntil:
    visible: "Join Game"
    timeout: 30000
