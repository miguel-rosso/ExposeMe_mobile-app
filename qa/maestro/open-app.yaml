# Cold-start the dev client pointed at local Metro and get past first-run screens.
# App screens are matched by testID (Client/app/utils/testIds.ts); only the dev-client boot (dev-client-boot.yaml)
# and the system photo alert use text. env: METRO_URL (url-encoded)
appId: com.socketNull.ExposeMe
---
- launchApp:
    clearState: true
    permissions:
      photos: allow
      medialibrary: allow
- runFlow: dev-client-boot.yaml
# App first-run permissions explainer (InitialScreen)
- runFlow:
    when:
      visible:
        id: "initial-screen"
    commands:
      # The dev client's floating Tools button is hidden by the app on launch (EXP-200), so the toggle is tappable
      # EXP-122: the onboarding offers the language toggle. Tap it twice (net no change, so later
      # flows keep the device language) and check the warning header switches language each time.
      - runFlow:
          when:
            visible:
              id: "initial-warning"
              text: ".*Warning.*"
          commands:
            - tapOn:
                id: "language-toggle"
            - extendedWaitUntil:
                visible:
                  id: "initial-warning"
                  text: ".*Aviso.*"
                timeout: 5000
            - tapOn:
                id: "language-toggle"
            - extendedWaitUntil:
                visible:
                  id: "initial-warning"
                  text: ".*Warning.*"
                timeout: 5000
      - runFlow:
          when:
            visible:
              id: "initial-warning"
              text: ".*Aviso.*"
          commands:
            - tapOn:
                id: "language-toggle"
            - extendedWaitUntil:
                visible:
                  id: "initial-warning"
                  text: ".*Warning.*"
                timeout: 5000
            - tapOn:
                id: "language-toggle"
            - extendedWaitUntil:
                visible:
                  id: "initial-warning"
                  text: ".*Aviso.*"
                timeout: 5000
      - scrollUntilVisible:
          element:
            id: "initial-continue-button"
      - tapOn:
          id: "initial-continue-button"
# iOS photo-library alert (shown even when simctl/launchApp pre-granted photos)
- tapOn:
    text: "Allow Full Access|Allow all|Allow|Permitir acceso total|Permitir todo|Permitir"
    optional: true
- extendedWaitUntil:
    visible:
      id: "join-game-button"
    timeout: 30000
