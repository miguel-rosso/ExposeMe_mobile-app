# Cold-start the dev client pointed at local Metro and get past first-run screens.
# App screens are matched by testID (Client/src/utils/testIds.ts); text only checks the language of an element matched
# by id, or finds the Expo dev-client UI (dev-client-boot.yaml) and the system photo alert
# (qa/lab/tests/maestro-selectors.test.sh). env: METRO_URL (url-encoded)
appId: com.socketNull.ExposeMe
---
- launchApp:
    clearState: true
    permissions:
      photos: allow
      medialibrary: allow
- runFlow: dev-client-boot.yaml
# App first-run permissions explainer (InitialScreen)
- runFlow:
    when:
      visible:
        id: "initial-screen"
    commands:
      # The dev client's floating Tools button is hidden by the app on launch (EXP-200), so the toggle is tappable
      # EXP-122: the onboarding offers the language toggle. Tap it twice (net no change, so later
      # flows keep the device language) and check the title switches language each time ((?s): it spans two lines).
      # EXP-282: a tap can be lost (it55, iOS: swallowed by a system gesture), so each switch is retried. The wait is
      # long enough that a slow switch is not taken for a lost tap (a second tap would undo it).
      - evalScript: "${output.titles = { en: '(?s)YOUR GALLERY.*', es: '(?s)TU GALER.*' }}"
      - evalScript: "${output.languageSwitch = { from: output.titles.es, to: output.titles.en }}"
      - runFlow:
          when:
            visible:
              id: "initial-title"
              text: ${output.titles.en}
          commands:
            - evalScript: "${output.languageSwitch = { from: output.titles.en, to: output.titles.es }}"
      - repeat:
          times: 2
          commands:
            - retry:
                maxRetries: 2
                commands:
                  - tapOn:
                      id: "language-toggle"
                  - extendedWaitUntil:
                      visible:
                        id: "initial-title"
                        text: ${output.languageSwitch.to}
                      timeout: 10000
            - evalScript: "${output.languageSwitch = { from: output.languageSwitch.to, to: output.languageSwitch.from }}"
      # Fixed footer above the bottom inset: on screen without scrolling (a scroll would hide a sliver regression)
      - assertVisible:
          id: "initial-continue-button"
      - tapOn:
          id: "initial-continue-button"
# iOS photo-library alert (shown even when simctl/launchApp pre-granted photos)
- tapOn:
    text: "Allow Full Access|Allow all|Allow|Permitir acceso total|Permitir todo|Permitir"
    optional: true
- extendedWaitUntil:
    visible:
      id: "join-game-button"
    timeout: 30000
