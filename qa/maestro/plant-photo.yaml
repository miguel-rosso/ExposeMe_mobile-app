# Plant a secret photo from the lobby: plant button → alert → system photo picker (newest photo). No crop screen
# (allowsEditing: false, EXP-126: a square planted photo would stand out). The app uploads and plants it at once.
# Works for the first plant ("Choose Photo") and for replacing one ("Change Photo"), en/es app and system UI.
# env: USERNAME
appId: com.socketNull.ExposeMe
---
- tapOn:
    id: "plant-photo-button"
- tapOn: "CHOOSE PHOTO|Choose Photo|ELEGIR FOTO|Elegir Foto|CHANGE PHOTO|Change Photo|CAMBIAR FOTO|Cambiar Foto"
# Android system photo picker
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 0
# iOS PHPicker grid (cells are labelled "Photo, <date>")
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "(Foto|Photo), .*"
          index: 0
- extendedWaitUntil:
    visible:
      id: "plant-photo-planted"
    timeout: 15000
- takeScreenshot: planted-${USERNAME}
