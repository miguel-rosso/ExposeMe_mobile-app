# Play until GAME OVER: each round tap a guess, screenshot it and check the scoreboard.
# Selectors are testIDs (Client/app/utils/testIds.ts), so the flow works in any UI language.
#
# Timing (EXP-238, EXP-267): on a slow Android emulator every step that reads the screen takes 1-4 s, while the server
# shows the options for 8 s (answering) + 3 s (reveal) and the scoreboard for 5 s. So each phase gets a few cheap
# steps, the one that matters first: the guess as soon as the options show, the score card as soon as the
# scoreboard opens. No settle waits (the progress bar never settles) and no `when: visible` before a timed check (a
# false condition costs up to 7 s). The steps between `timed:` markers are budgeted by qa/lab/tests/maestro-timing.test.sh.
appId: com.socketNull.ExposeMe
---
- runFlow: wait-game-start.yaml
- extendedWaitUntil:
    visible:
      id: "game-waiting-ready|game-waiting-photo|player-option-.*|score-modal"
    timeout: 180000
- repeat:
    while:
      notVisible:
        id: "winner-modal|final-score-modal"
    commands:
      # Next round's options, or the end of the game. Up to 3 photo waits of 15 s in a row (skips) end the game.
      - extendedWaitUntil:
          visible:
            id: "player-option-.*|winner-modal|final-score-modal"
          timeout: 90000
      # ── timed: answering ──
      - tapOn:
          id: "player-option-bot1"
          optional: true
          waitToSettleTimeoutMs: 500
      - evalScript: ${output.shot = (output.shot || 0) + 1}
      - takeScreenshot: round-${USERNAME}-${output.shot}
      # EXP-119: the round photo's loading spinner goes away once the photo has loaded (absent outside the photo phases)
      - extendedWaitUntil:
          notVisible:
            id: "photo-loading"
          timeout: 5000
      # ── end timed ──
      # EXP-252: the scoreboard opens with the card saying whose photo it was ("It was your photo!" on the owner's
      # phone). Waited for directly, so it is checked in the same screen read that sees the scoreboard. The timeout
      # covers what is left of answering + reveal (8 + 3 s), and even after slow answering steps it ends before the
      # next round's scoreboard could show up (answering + reveal + scores + answering + reveal = 27 s after this
      # round's options at the earliest), so a scoreboard without the card fails here instead of passing on a later
      # one. Only the last round's card goes unchecked if it is missing: the winner modal follows its scoreboard.
      # ── timed: scores ──
      - extendedWaitUntil:
          visible:
            id: "score-answer-card|winner-modal|final-score-modal"
          timeout: 14000
      # EXP-141: the scoreboard is drawn alone, with no answer options under it. `below` the scoreboard's title ties
      # both to the same screen read, and the short timeout fails while both are drawn instead of waiting for the
      # scoreboard to close (once it has closed, the next round's options can't match).
      - extendedWaitUntil:
          notVisible:
            id: "player-option-.*"
            below:
              id: "score-round-title"
          timeout: 1000
      # ── end timed ──
- takeScreenshot: final-${USERNAME}
# "Tap anywhere to continue" only renders once the winner animation is tappable
- runFlow:
    when:
      visible:
        id: "winner-modal"
    commands:
      - extendedWaitUntil:
          visible:
            id: "winner-continue"
          timeout: 15000
      - tapOn:
          id: "winner-continue"
- extendedWaitUntil:
    visible:
      id: "final-score-modal"
    timeout: 20000
- takeScreenshot: results-${USERNAME}
