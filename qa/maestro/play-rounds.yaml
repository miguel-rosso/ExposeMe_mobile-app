# Play until GAME OVER: each round tap a guess, screenshot every phase we can catch.
# Selectors are testIDs (Client/app/utils/testIds.ts), so the flow works in any UI language.
appId: com.socketNull.ExposeMe
---
- runFlow: wait-game-start.yaml
- extendedWaitUntil:
    visible:
      id: "game-waiting-ready|game-waiting-photo|player-option-.*|score-modal"
    timeout: 180000
- repeat:
    while:
      notVisible:
        id: "winner-modal|final-score-modal"
    commands:
      # Short settle wait: the answer progress bar never settles, so on Android the default wait
      # delayed the tap 8-15 s, past the 8 s answer window (guess was always empty)
      - tapOn:
          id: "player-option-bot1"
          optional: true
          waitToSettleTimeoutMs: 500
      - evalScript: ${output.shot = (output.shot || 0) + 1}
      - takeScreenshot: round-${USERNAME}-${output.shot}
      # EXP-141: the scoreboard is drawn alone, with no answer options under it.
      # EXP-252: it opens with the card saying whose photo it was ("It was your photo!" on the owner's phone)
      - runFlow:
          when:
            visible:
              id: "score-modal"
          commands:
            - assertNotVisible:
                id: "player-option-.*"
            - assertVisible:
                id: "score-answer-card"
      - waitForAnimationToEnd:
          timeout: 4000
- takeScreenshot: final-${USERNAME}
# "Tap anywhere to continue" only renders once the winner animation is tappable
- runFlow:
    when:
      visible:
        id: "winner-modal"
    commands:
      - extendedWaitUntil:
          visible:
            id: "winner-continue"
          timeout: 15000
      - tapOn:
          id: "winner-continue"
- extendedWaitUntil:
    visible:
      id: "final-score-modal"
    timeout: 20000
- takeScreenshot: results-${USERNAME}
