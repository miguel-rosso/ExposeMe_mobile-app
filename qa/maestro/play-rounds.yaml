# Play until GAME OVER: each round tap a guess, screenshot every phase we can catch.
appId: com.socketNull.ExposeMe
---
- extendedWaitUntil:
    visible: "ARE YOU READY\\?|Round .*"
    timeout: 60000
- repeat:
    while:
      notVisible: "GAME OVER|WINNER!"
    commands:
      - tapOn:
          text: "bot1"
          optional: true
      - evalScript: ${output.shot = (output.shot || 0) + 1}
      - takeScreenshot: round-${USERNAME}-${output.shot}
      - waitForAnimationToEnd:
          timeout: 4000
- takeScreenshot: final-${USERNAME}
- tapOn:
    text: "Tap anywhere to continue"
    optional: true
- extendedWaitUntil:
    visible: "Final Results|Exit"
    timeout: 20000
- takeScreenshot: results-${USERNAME}
