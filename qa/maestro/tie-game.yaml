# EXP-085 / DEC-013: nobody answers, so everyone ends on 0 points and all players are tied 1st.
# The winner screen must list every tied player under "WINNERS!" and the final scoreboard must
# rank them all 1. Bots must never answer either:
#   qa/lab/lab.sh play --flow tie-game --bots 1 --devices pair --bot-args --no-answer
# Keep it to <= 3 players so every final-score row fits without scrolling.
# env: GAME_CODE, USERNAME, METRO_URL (url-encoded)
# Selectors are testIDs (Client/app/utils/testIds.ts), so the flow works in any UI language.
appId: com.socketNull.ExposeMe
---
- runFlow: open-app.yaml
- runFlow: join-room.yaml
- extendedWaitUntil:
    visible:
      id: "game-waiting-ready|player-option-.*|score-modal"
    timeout: 60000
# Play without ever tapping a player option (empty guess every round)
- repeat:
    while:
      notVisible:
        id: "winner-modal|final-score-modal"
    commands:
      - evalScript: ${output.shot = (output.shot || 0) + 1}
      - takeScreenshot: tie-round-${USERNAME}-${output.shot}
      - waitForAnimationToEnd:
          timeout: 4000
- assertVisible:
    id: "winner-modal"
- extendedWaitUntil:
    visible:
      id: "winner-title"
      text: "WINNERS!|¡GANADORES!"
    timeout: 5000
- assertVisible:
    id: "winner-name-${USERNAME}"
- assertVisible:
    id: "winner-name-bot1"
- takeScreenshot: tie-winners-${USERNAME}
# "Tap anywhere to continue" only renders once the winner animation is tappable
- extendedWaitUntil:
    visible:
      id: "winner-continue"
    timeout: 15000
- tapOn:
    id: "winner-continue"
- extendedWaitUntil:
    visible:
      id: "final-score-modal"
    timeout: 20000
- assertVisible:
    id: "final-winner-${USERNAME}"
- assertVisible:
    id: "final-winner-bot1"
- assertVisible:
    id: "final-rank-${USERNAME}"
    text: "1"
- assertVisible:
    id: "final-rank-bot1"
    text: "1"
- takeScreenshot: tie-results-${USERNAME}
