# Type ${GAME_CODE} into the home screen's room code field, replacing whatever it holds (used by search-room.yaml).
appId: com.socketNull.ExposeMe
---
# The field keeps the last code entered/created in this session (GameContext gameCode) and a tap puts the
# cursor mid-text, so eraseText alone leaves characters after it: double tap selects the whole code first
- runFlow:
    when:
      visible:
        id: "game-code-input"
        text: "[A-Z0-9]+"
    commands:
      - doubleTapOn:
          id: "game-code-input"
      - eraseText: 12
- tapOn:
    id: "game-code-input"
- inputText: ${GAME_CODE}
# The keyboard stays up: its Enter is the search itself (EXP-378), which the caller presses once the code is checked
